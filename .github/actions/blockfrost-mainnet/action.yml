name: Blockfrost mainnet config
description: >
  Points midnight-cast's mainnet endpoints at Blockfrost using a project token.
  Midnight retired its hosted mainnet RPC and indexer on 2026-09-30; Blockfrost
  now serves them and every request needs a Midnight Mainnet project_id.
  Writes a config under $RUNNER_TEMP (never the workspace) and exports
  XDG_CONFIG_HOME. When the token is empty it reports configured=false
  (mainnet skipped, not passed), or fails if `required` is true.

inputs:
  project-id:
    description: Blockfrost Midnight Mainnet project ID
    required: false
    default: ""
  required:
    description: >
      'true' to fail when the token is missing. Used where mainnet must be
      checked (release PRs into main), so a required check can't pass without it.
    required: false
    default: "false"

outputs:
  configured:
    description: "'true' when a mainnet config was written"
    value: ${{ steps.write.outputs.configured }}

runs:
  using: composite
  steps:
    - id: write
      shell: bash
      env:
        PROJECT_ID: ${{ inputs.project-id }}
        REQUIRED: ${{ inputs.required }}
      run: |
        if [ -z "$PROJECT_ID" ]; then
          if [ "$REQUIRED" = "true" ]; then
            echo "::error title=mainnet not checked::Secret BLOCKFROST_MAINNET_PROJECT_ID is not set, so mainnet can't be checked. It is required here."
            exit 1
          fi
          echo "::notice title=mainnet skipped::No Blockfrost mainnet token (secret BLOCKFROST_MAINNET_PROJECT_ID); mainnet checks are skipped, not passed."
          echo "### ⏭️ mainnet: skipped (no BLOCKFROST_MAINNET_PROJECT_ID secret)" >> "$GITHUB_STEP_SUMMARY"
          echo "configured=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "::add-mask::$PROJECT_ID"
        dir="$RUNNER_TEMP/midnight-cast-xdg/midnight-cast"
        mkdir -p "$dir"
        umask 077
        cat > "$dir/config.toml" <<EOF
        [networks.mainnet]
        network_id = "mainnet"
        rpc = "https://rpc.midnight-mainnet.blockfrost.io?project_id=$PROJECT_ID"
        rpc_ws = "wss://rpc.midnight-mainnet.blockfrost.io?project_id=$PROJECT_ID"
        indexer_http = "https://midnight-mainnet.blockfrost.io/api/v0?project_id=$PROJECT_ID"
        indexer_ws = "wss://midnight-mainnet.blockfrost.io/api/v0/ws?project_id=$PROJECT_ID"
        EOF
        echo "XDG_CONFIG_HOME=$RUNNER_TEMP/midnight-cast-xdg" >> "$GITHUB_ENV"
        echo "MN_MAINNET_SMOKE=1" >> "$GITHUB_ENV"
        echo "BLOCKFROST_PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"
        echo "configured=true" >> "$GITHUB_OUTPUT"
