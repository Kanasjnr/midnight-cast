name: Blockfrost config
description: >
  Exports BLOCKFROST_<NETWORK>_PROJECT_ID so midnight-cast reaches preprod or
  mainnet through Blockfrost, the way users configure it. When the token is
  empty it reports configured=false (the network is skipped, not passed), or
  fails if `required` is true.

inputs:
  network:
    description: preprod or mainnet
    required: true
  project-id:
    description: The network's Blockfrost project ID (a Midnight Preprod or Midnight Mainnet project)
    required: false
    default: ""
  required:
    description: >
      'true' to fail when the token is missing. Used where the network must be
      checked (pull requests and pushes), so a required check can't pass without it.
    required: false
    default: "false"

outputs:
  configured:
    description: "'true' when the network's project ID was exported"
    value: ${{ steps.write.outputs.configured }}

runs:
  using: composite
  steps:
    - id: write
      shell: bash
      env:
        NETWORK: ${{ inputs.network }}
        PROJECT_ID: ${{ inputs.project-id }}
        REQUIRED: ${{ inputs.required }}
      run: |
        variable="BLOCKFROST_$(echo "$NETWORK" | tr '[:lower:]' '[:upper:]')_PROJECT_ID"
        if [ -z "$PROJECT_ID" ]; then
          if [ "$REQUIRED" = "true" ]; then
            echo "::error title=$NETWORK not checked::Secret $variable is not set, so $NETWORK can't be checked. It is required here."
            exit 1
          fi
          echo "::notice title=$NETWORK skipped::No Blockfrost $NETWORK token (secret $variable); $NETWORK checks are skipped, not passed."
          echo "### ⏭️ $NETWORK: skipped (no $variable secret)" >> "$GITHUB_STEP_SUMMARY"
          echo "configured=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "::add-mask::$PROJECT_ID"
        echo "$variable=$PROJECT_ID" >> "$GITHUB_ENV"
        echo "configured=true" >> "$GITHUB_OUTPUT"
