name: Tests

on:
  push:
    branches: [main, next-release]
  pull_request:
    branches: [main, next-release]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Deterministic: no network, no wall clock. Fails only for code reasons.
  test:
    name: Unit (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ["20", "22", "24"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

  # Live, but only asserts invariants (services up, RPC and indexer agree,
  # JSON shape, known tx decodes). Bundled-matrix drift is the job of
  # live.yml, so a network upgrade alone never turns a PR red.
  smoke:
    name: Smoke (live preview, preprod, mainnet)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure mainnet (Blockfrost)
        uses: ./.github/actions/blockfrost-mainnet
        with:
          project-id: ${{ secrets.BLOCKFROST_MAINNET_PROJECT_ID }}

      - name: Run live smoke tests
        run: npm run test:smoke
        env:
          INTEGRATION: "1"
