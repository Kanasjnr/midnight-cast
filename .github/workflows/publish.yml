name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  tarball:
    # Only publish when the GitHub release targets main (not next-release).
    if: github.event.release.target_commitish == 'main'
    uses: ./.github/workflows/tarball.yml

  binaries:
    if: github.event.release.target_commitish == 'main'
    uses: ./.github/workflows/binaries.yml
    with:
      attest: true
    permissions:
      contents: read
      id-token: write
      attestations: write

  live-recent:
    name: Networks checked clean in the last 24h
    if: github.event.release.target_commitish == 'main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: read
    steps:
      # Only scheduled runs and pushes to main check every network and job; a manual run can check one.
      - name: Find the latest full live check on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow live.yml --branch main --status success \
            --limit 20 --json createdAt,event \
            --jq '[.[] | select(.event == "schedule" or .event == "push")][0].createdAt // empty')
          if [ -z "$last" ]; then
            echo "::error::No successful live check on main. Run live.yml from the Actions tab, then re-run this job."
            exit 1
          fi
          age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) ))
          if [ "$age" -gt 86400 ]; then
            echo "::error::The last successful live check on main was at $last, more than 24h ago. Run live.yml, then re-run this job."
            exit 1
          fi
          echo "Live check passed at $last"

      # Drift only warns in a scheduled run, but it keeps a live-check issue open until the network is clean.
      # A degraded network is Midnight's to fix and doesn't make a release wrong, so it doesn't block.
      # Only an issue that both carries the label and says degraded in its body is let through.
      - name: Make sure no network has open drift or outage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label live-check --state open --json title,labels,body \
            --jq 'map(select((any(.labels[]; .name == "live-check: degraded") and (.body | contains("<!-- live-check status: degraded -->"))) | not) | .title) | join(", ")')
          if [ -n "$open" ]; then
            echo "::error::Open live-check issues: $open. Resolve them before publishing."
            exit 1
          fi

  release-binaries:
    # Attached only once the gates npm publishing waits for have passed, so install.sh never fetches a release they rejected.
    needs: [binaries, tarball, live-recent]
    if: github.event.release.target_commitish == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: midnight-cast-binaries
          path: build/release

      - name: Attach the binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/release/* --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    # npm doesn't wait for the binaries: they're additive, and a failed binary job can be re-run after.
    needs: [tarball, live-recent]
    runs-on: ubuntu-latest
    # npm trusted publishing: npm accepts this workflow through GitHub's OIDC token, so there's no npm token
    # to expire, and it adds provenance itself. It's set up on npmjs.com (see docs/RELEASING.md).
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: npm supports trusted publishing
        run: |
          version=$(npm --version)
          if [ "$(printf '%s\n' 11.5.1 "$version" | sort -V | head -1)" != 11.5.1 ]; then
            echo "::error::npm $version can't publish with OIDC; trusted publishing needs npm 11.5.1 or later."
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - run: npm publish --access public

  mcp-registry:
    name: List in the MCP Registry
    # The registry only holds metadata: it reads mcpName from the version just published to npm.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: "1.8.1"
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@v4

      - name: Wait until npm serves this version
        run: |
          version=$(jq -r .version package.json)
          for attempt in $(seq 1 24); do
            if [ "$(npm view "midnight-cast@$version" mcpName 2>/dev/null)" = "$(jq -r .name server.json)" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::npm doesn't serve midnight-cast@$version with mcpName yet. Re-run this job once it does."
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher

      - name: Publish server.json
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
