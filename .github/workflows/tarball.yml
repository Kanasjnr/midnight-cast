name: Tarball

# Packs the package the way npm publishes it, installs it into an empty project
# and runs the installed CLI. A release PR into main must pass it, and publish.yml
# runs it again before publishing, keeping the Node 24 tarball it tested so the
# publish job uploads exactly that file. PRs into next-release run it offline, like
# the other checks there.

on:
  pull_request:
    branches: [main, next-release]
  workflow_call:
    inputs:
      keep:
        description: Upload the tarball the Linux Node 24 job tested, as the npm-tarball artifact
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Tarball (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      KEEP: ${{ inputs.keep && matrix.os == 'ubuntu-latest' && matrix.node-version == '24' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node-version: "20" }
          - { os: ubuntu-latest, node-version: "22" }
          - { os: ubuntu-latest, node-version: "24" }
          # npx runs bins through .cmd shims on Windows.
          - { os: windows-latest, node-version: "22" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # No install scripts: this job builds the bytes npm publishes. esbuild, the only dependency with one,
      # works without it.
      - run: npm ci --ignore-scripts

      - run: npm run build

      - name: Pack, install and run the tarball
        run: npm run smoke:tarball -- ${{ github.base_ref == 'next-release' && '--offline' || '' }} ${{ env.KEEP == 'true' && '--keep build/package' || '' }}

      - if: env.KEEP == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: build/package/*.tgz
          if-no-files-found: error
