name: Live network check

# Watches preview, preprod and mainnet for drift between what each network is
# running, the support matrix bundled in midnight-cast, and the matrix Midnight
# publishes upstream. Keeps one `live-check` issue per network in sync.

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      network:
        description: Network to check
        type: choice
        options: [all, preview, preprod, mainnet]
        default: all
  # No path filter: a required check whose workflow never starts would leave
  # the release PR waiting forever.
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: live-check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Live (${{ matrix.network }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        network: [preview, preprod, mainnet]

    steps:
      - name: Select
        id: select
        env:
          WANTED: ${{ inputs.network || 'all' }}
        run: |
          if [ "$WANTED" = "all" ] || [ "$WANTED" = "${{ matrix.network }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping ${{ matrix.network }} (requested: $WANTED)"
          fi

      - name: Checkout
        if: steps.select.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.select.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        if: steps.select.outputs.run == 'true'
        run: npm ci

      - name: Build
        if: steps.select.outputs.run == 'true'
        run: npm run build

      # Preprod and mainnet go through Blockfrost, with a project ID each; preview is Midnight's and needs none.
      # One step per network: an empty secret must stay empty, not fall back to the other network's.
      - name: Configure preprod (Blockfrost)
        id: preprod
        if: steps.select.outputs.run == 'true' && matrix.network == 'preprod'
        uses: ./.github/actions/blockfrost
        with:
          network: preprod
          project-id: ${{ secrets.BLOCKFROST_PREPROD_PROJECT_ID }}
          required: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

      - name: Configure mainnet (Blockfrost)
        id: mainnet
        if: steps.select.outputs.run == 'true' && matrix.network == 'mainnet'
        uses: ./.github/actions/blockfrost
        with:
          network: mainnet
          project-id: ${{ secrets.BLOCKFROST_MAINNET_PROJECT_ID }}
          required: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

      - name: Check ${{ matrix.network }}
        id: check
        if: steps.select.outputs.run == 'true' && (matrix.network == 'preview' || steps.preprod.outputs.configured == 'true' || steps.mainnet.outputs.configured == 'true')
        run: |
          set +e
          npm run --silent live-check -- "${{ matrix.network }}" --out live-check
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload report
        if: steps.check.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: live-check-${{ matrix.network }}
          path: live-check/
          retention-days: 14

      - name: Sync issue
        if: steps.check.outcome == 'success' && github.event_name != 'pull_request' && steps.check.outputs.code != '2'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          npx tsx scripts/live-issue.ts "${{ matrix.network }}"
          "${{ steps.check.outputs.status }}" "${{ steps.check.outputs.fingerprint }}"
          live-check/report.md

      - name: Verdict
        if: steps.check.outcome == 'success'
        env:
          CODE: ${{ steps.check.outputs.code }}
          EVENT: ${{ github.event_name }}
          BLOCKERS: ${{ steps.check.outputs.blockers }}
        run: |
          case "$CODE" in
            0) echo "${{ matrix.network }}: clean" ;;
            10)
              # On a release PR, live-check's blockers decide: disagreement with
              # the live network, or upstream ahead for components the endpoints
              # don't reveal. Upstream ahead for node or proof server is a heads-up.
              if [ "$EVENT" = "pull_request" ] && [ -n "$BLOCKERS" ]; then
                echo "::error title=release blocked (${{ matrix.network }})::$BLOCKERS. The bundled support matrix must match what ${{ matrix.network }} is running: refresh src/data/support-matrix.json on next-release. See the job summary."
                exit 1
              fi
              echo "::warning title=${{ matrix.network }} drift::See the job summary for details." ;;
            20) echo "::error title=${{ matrix.network }} outage::Public endpoints failed after retries. The live-check issue has a service desk draft to review."; exit 1 ;;
            30) echo "::warning title=${{ matrix.network }} degraded::The network answers but misbehaves. The live-check issue has a service desk draft to review." ;;
            2) echo "::error title=${{ matrix.network }} incomplete::Check could not complete (upstream matrix unavailable or internal error); issue left unchanged."; exit 1 ;;
            *) echo "::error::live-check exited with $CODE"; exit 1 ;;
          esac

  smoke:
    name: Smoke (live preview, preprod, mainnet)
    if: github.event_name != 'workflow_dispatch' || inputs.network == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Configure preprod (Blockfrost)
        uses: ./.github/actions/blockfrost
        with:
          network: preprod
          project-id: ${{ secrets.BLOCKFROST_PREPROD_PROJECT_ID }}
          required: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

      - name: Configure mainnet (Blockfrost)
        uses: ./.github/actions/blockfrost
        with:
          network: mainnet
          project-id: ${{ secrets.BLOCKFROST_MAINNET_PROJECT_ID }}
          required: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

      - name: Run live smoke tests
        run: npm run test:smoke
        env:
          INTEGRATION: "1"

  error-codes:
    name: Error codes (node source, Midnight Expert)
    if: github.event_name != 'workflow_dispatch' || inputs.network == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Compare the ledger error map with the deployed node
        run: npm run error-codes

  examples-reports:
    name: Examples reports (midnight-examples)
    if: github.event_name != 'workflow_dispatch' || inputs.network == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Compare the bundled summaries with midnight-examples' regression reports
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run examples-reports -- --check

  examples-index:
    name: Examples index (midnight-examples pin)
    if: github.event_name != 'workflow_dispatch' || inputs.network == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Check the examples index against its pinned commit, and note if midnight-examples moved on
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run examples-index -- --check

  runbooks-index:
    name: Runbooks index (service desk)
    if: github.event_name != 'workflow_dispatch' || inputs.network == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --ignore-scripts

      # A change to the service desk's lookup table is shipped in a patch, not a reason to block a release, so
      # this never fails the run. A scheduled run keeps one `runbooks` issue with the rows that differ.
      - name: Compare the bundled runbook strings with the service desk's lookup table on main
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          code=0
          npm run --silent runbooks-index -- --check > runbooks.txt 2>&1 || code=$?
          cat runbooks.txt
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label runbooks --state open --json number --jq '.[0].number // empty')
          if [ "$code" = 0 ] && [ -n "$open" ] && [ "$SCHEDULED" = true ]; then
            gh issue close "$open" --repo "$GITHUB_REPOSITORY" --comment "The bundled runbook strings match the service desk's lookup table again."
          elif [ "$code" = 2 ]; then
            echo "::warning title=Runbooks not compared::$(head -1 runbooks.txt)"
          elif [ "$code" = 1 ]; then
            echo "::warning title=Runbooks moved on::The service desk's lookup table differs from src/data/runbooks.json. Run npm run runbooks-index and ship it in a patch."
            if [ "$SCHEDULED" = true ]; then
              gh label create runbooks --repo "$GITHUB_REPOSITORY" --color C5DEF5 --description "The service desk's runbooks moved on" 2>/dev/null || true
              { echo "The service desk's runbooks index on main no longer matches the strings \`decode\` bundles. Run \`npm run runbooks-index\`, review the diff, and ship it in a patch."; echo; echo '```'; cat runbooks.txt; echo '```'; } > body.md
              if [ -n "$open" ]; then
                gh issue edit "$open" --repo "$GITHUB_REPOSITORY" --body-file body.md
              else
                gh issue create --repo "$GITHUB_REPOSITORY" --title "Runbooks: the service desk's lookup table moved on" --label runbooks --body-file body.md
              fi
            fi
          fi

  response-shapes:
    name: Response shapes (preview, preprod, mainnet)
    if: github.event_name != 'workflow_dispatch' || inputs.network == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Configure preprod (Blockfrost)
        uses: ./.github/actions/blockfrost
        with:
          network: preprod
          project-id: ${{ secrets.BLOCKFROST_PREPROD_PROJECT_ID }}
          required: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

      - name: Configure mainnet (Blockfrost)
        uses: ./.github/actions/blockfrost
        with:
          network: mainnet
          project-id: ${{ secrets.BLOCKFROST_MAINNET_PROJECT_ID }}
          required: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

      - name: Compare live responses and the indexer schema with the recorded fixtures
        run: npm run fixtures -- --check
